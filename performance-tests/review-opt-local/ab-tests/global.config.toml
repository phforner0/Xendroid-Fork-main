[APU]
apu = "aaudio"                                    	# Audio system. Use: [any, nop, opensles, aaudio]
apu_aaudio_buffer_bursts = 4                      	# Depth of the Android audio buffer, in device bursts. Higher rides out emulator slowdowns without dropping audio, at the cost of latency.
apu_aaudio_dynamic_rate = true                    	# Slow playback toward 0.9x as the audio queue drains, so a guest that cannot keep real time bends pitch instead of popping.
apu_aaudio_log_stats = false                      	# Log Android audio callback statistics (gaps, queue depth, underruns) once a second.
apu_max_queued_frames = 8                         	# Allows changing max buffered audio frames to reduce audio delay. Lowering this value might cause performance issues. Value range: [4-64]
apu_performance_hint = true                       	# Register an ADPF performance hint session over the guest dispatch and audio threads so the power HAL holds clocks for the audio deadline.
apu_pump_topup = true                             	# Let the audio buffer refill at up to twice real time while it is running low, instead of only one frame per 5.33ms interval.
enable_xmp = true                                 	# Enables Music Player playback.
ffmpeg_verbose = false                            	# Verbose FFmpeg output (debug and above)
use_dedicated_xma_thread = true                   	# Enables XMA decoding on separate thread. Disabled should produce better results, but decrease performance a bit.
volume = 100                                      	# Master volume for all audio output, from 0 (silent) to 100 (full volume).
xma_decoder = "new"                               	# Decoder version used to process XMA audio.
                                                  	# Use: [fake, master, old, new]
                                                  	#  fake: 
                                                  	#   No audio will be decoded.
                                                  	#  master: 
                                                  	#   Version of decoder exactly like on base version of Xenia.
                                                  	#  old: 
                                                  	#   Decoder based on master version of decoder with few improvements.
                                                  	#  new: 
                                                  	#   New version of decoder. Provides highest stability, but isn't yet finished.


[CPU]
a64_native_reserved_ops = true                    	# Compile guest lwarx/stwcx. to inline native atomics (LSE CASAL) instead of the software-reservation thunk: lwarx captures the word and arms a per-thread flag; stwcx. validates with one CAS. The single atomic has no LDXR->STXR window, avoiding the monitor-loss livelock of a spanning ldaxr/stlxr (which hung Forza Horizon). Requires FEAT_LSE.
a64_park_spin_backoff = true                      	# For collapsed guest spin-backoff loops, spin cheaply for the first few iterations then park the thread with a short real sleep (adaptive) instead of the fixed isb sled - reclaims CPU on long guest spin-waits while short waits (resolved during the cheap spin) stay latency-unaffected. Falls back to a cheap spin under the cooperative guest scheduler, where host-blocking a fiber could stall its producer.
a64_perf_map = true                               	# Write a simpleperf/perf 'generic JIT symbols' map file (perf-<pid>.map) mapping generated code to guest function names, so profilers can attribute JIT samples.
break_condition_gpr = -1                          	# GPR compared to
break_condition_op = "eq"                         	# comparison operator
break_condition_truncate = true                   	# truncate value to 32-bits
break_condition_value = 0                         	# value compared against
break_on_debugbreak = true                        	# int3 on JITed __debugbreak requests.
break_on_instruction = 0                          	# int3 before the given guest address is executed.
break_on_start = false                            	# Break into the debugger on startup.
break_on_unimplemented_instructions = true        	# Break to the host debugger (or crash if no debugger attached) if an unimplemented PowerPC instruction is encountered.
clock_no_scaling = false                          	# Disable scaling code. Time management and locking is bypassed. Guest system time is directly pulled from host.
clock_source_raw = false                          	# On x64, Use the RDTSC instruction as the time source. Requires invariant TSC. On a64, Use the CNTVCT_EL0 register as the time source
collapse_ctr_spin_loops = true                    	# Collapse constant-trip-count bdnz spin-backoff loops (the XDK spin-wait primitive: mtctr small-constant + a sled of priority-hint nops + bdnz) into a single bounded host backoff. Guest semantics are preserved (CTR reads 0 after the loop); only the per-iteration CTR round trip through guest context is eliminated. Disable to translate such loops literally.
collapse_memory_delay_spins = true                	# Collapse guest delay-countdown self-loops whose loop counter lives in memory (a stack slot) instead of CTR - `while (--*slot != 0) db16cyc...` - into one body pass, the exact exit state (slot = 0, flags as if the loop ran out), and one adaptive backoff. The memory-counter sibling of collapse_ctr_spin_loops: the guest compiler sometimes spills the delay counter instead of using mtctr. Requires a delay_execution sled in the body as proof of delay intent, a thread-private stack counter, and every exit-state value provably computable, else the loop is left alone. Detection is default-deny and rare in practice; every accepted collapse is logged. Disable for a title that depends on the elided wall time.
context_promote_vec128 = true                     	# Promote VMX (VEC128) context loads/stores to SSA values and strip dead VEC128 context stores, letting the backend keep vectors in host registers. This restores upstream behavior from before 2026-01-25 (upstream excluded VEC128 to work around undiagnosed instability in some games; validity tracking is now range-keyed with overlap invalidation, which removes the offset-aliasing hazard that plausibly caused it). Disabling trades performance for current upstream's conservative behavior: every vector register access round-trips through guest context memory. Forced off by disable_context_promotion.
cpu = "any"                                       	# Does nothing. CPU backend [any, x64].
cpu_trace_mask = 0                                	# JIT execution trace modes to log (bitmask): 1=instructions, 2=data, 4=function calls (7=all). Each mode must be compiled in to be usable.
disable_context_promotion = false                 	# Disables Context Promotion optimizations, this may be needed for some sports games, but will reduce performance.
disable_instruction_infocache = false             	# Disables caching records of called instructions/mmio accesses.
disable_prefetch_and_cachecontrol = true          	# Disables translating ppc prefetch/cache flush instructions to host prefetch/cacheflush instructions. This may improve performance as these instructions were written with the Xbox 360's cache in mind, and modern processors do their own automatic prefetching.
disassemble_functions = false                     	# Disassemble functions during generation.
dump_functions_at = ""                            	# Comma-separated guest addresses (hex) whose PPC source, optimized HIR and host machine code are written to <log dir>/fndump_<address>.txt when first translated.
dump_translated_hir_functions = false             	# dumps translated hir
emit_inline_mmio_checks = false                   	# Emit inline MMIO range checks for all I32 loads/stores instead of relying on exception-based MMIO detection.
emit_mmio_aware_stores_for_recorded_exception_addresses = true	# Uses info gathered via record_mmio_access_exceptions to emit special stores that are faster than trapping the exception
enable_early_precompilation = false               	# Enable pre-compiling guest functions that we know we've called/that we've recognized as being functions via simple heuristics, good for error finding/stress testing with the JIT
full_optimization_even_with_debug = false         	# For developer use to analyze the quality of the generated code, not intended for actual debugging of the code
ignore_trap_instructions = true                   	# Generate no code for powerpc trap instructions, can result in better performance in games that aggressively check with trap.
inline_gprlr_saverest = true                      	# Expand calls to the XDK __savegprlr_N/__restgprlr_N helpers inline instead of emitting real guest calls. The helpers are a handful of stack stores or loads, but as calls each one pays LR bookkeeping, the call indirection, a full guest prologue with a stackpoint push, and the return protocol - measured at a fifth of a pegged dispatch thread in call-heavy guest loops. The module loader already identifies the helpers; this consumes that mark at translation time.
inline_gprlr_saverest_parts = 3                   	# Bisect aid for inline_gprlr_saverest: bit 0 inlines the save helpers, bit 1 the restore helpers. 3 = both. Only consulted while inline_gprlr_saverest itself is on.
inline_leaf_calls = true                          	# Expand calls to small leaf guest functions inline instead of emitting a real call. A leaf here is a run of straight-line instructions ending in blr with no branches, traps or calls of its own, so inlining cannot recurse and the function cannot longjmp through the skipped frame. Saves the call indirection, the guest prologue and its stackpoint push, and the return protocol - which together dwarf the two or three instructions some of these leaves actually contain.
inline_leaf_max_instructions = 16                 	# Largest leaf, in guest instructions, that inline_leaf_calls will expand. Raising it trades code cache size and translation time for fewer calls.
inline_mmio_access = true                         	# Inline constant MMIO loads and stores.
load_module_map = ""                              	# Loads a .map for symbol names and to diff with the generated symbol database.
log_delay_collapse_rejects = false                	# Log every candidate delay-countdown self-loop that collapse_memory_delay_spins rejects, with the guest address and the failing predicate. Diagnostic aid; noisy during precompilation. Accepted collapses are always logged regardless of this setting.
log_guest_call_fields = ""                        	# Comma-separated guest words to dump on every log_guest_calls_at entry. Each term is <gpr>+<hex offset>, optionally followed by ><hex offset> to dereference it and re-offset, and by :<count> for several words, e.g. "r4+30,r4+4>F8,r4+4>B0:4".
log_guest_calls_at = ""                           	# Comma-separated guest addresses (hex) whose entry and return are logged with the guest argument registers. arm64 only.
log_guest_calls_limit = 1000                      	# Entry and return lines logged per address by log_guest_calls_at; 0 is unlimited. A return whose value differs from the last one is always logged.
log_memory_poll_park = false                      	# Log every candidate memory-poll self-loop this pass rejects, with the guest address and the failing condition. Accepted loops are always logged.
log_safepoint_pc = false                          	# Record the guest address of every JIT safepoint a fiber passes, so the cooperative scheduler's no-progress report can name where a wedged fiber last checked in rather than only its link register. Costs a materialize and a store on every loop back-edge; diagnostic only.
log_spin_loop_rejects = false                     	# Log every candidate bdnz self-loop that collapse_ctr_spin_loops rejects, with the guest address and the first failing predicate condition. Diagnostic aid; noisy during shader-storage precompilation.
log_spin_wait_histogram = false                   	# Bucket the wall-clock length of every collapsed guest spin-wait episode and dump the distribution once per second. Requires a64_park_spin_backoff.
no_reserved_ops = false                           	# For testing whether a game may have races with a broken reserved load/store impl
park_memory_poll_loops = true                     	# Give indefinite guest memory-poll loops (load, test, branch back - the shape GPU fence and frame waits take) the same adaptive spin-then-park backoff collapsed spin loops use, so a long wait stops burning a core. Nothing is removed or reordered: every iteration still runs, a young wait still spins cheap, only a wait that has proven long sleeps in bounded slices. Loops that read the clock, store, call or use atomics keep their real form.
permit_float_constant_evaluation = false          	# Allow float constant evaluation, may produce incorrect results and break games math
pvr = 7407360                                     	# Known PVR's.
                                                  	#  0x710200 = Used by Zephyr 
                                                  	#  0x710300 = Used by Zephyr
                                                  	#  0x710500 = Used by Jasper
                                                  	#  0x710700 = Default
                                                  	#  0x710800 = Used by Corona V1 & V2
                                                  	# Processor version and revision number.
                                                  	# Bits 0 to 15 are the version number.
                                                  	# Bits 16 to 31 are the revision number.
                                                  	# Note: Some XEXs (such as mfgbootlauncher.xex) may check for a value that's less than 0x710700.

record_mmio_access_exceptions = true              	# For guest addresses records whether we caught any mmio accesses for them. This info can then be used on a subsequent run to instruct the recompiler to emit checks
store_all_context_values = false                  	# Don't strip dead context stores to aid in debugging.
trace_function_coverage = false                   	# Generate tracing for function instruction coverage statistics.
trace_function_data = false                       	# Generate tracing for function result data.
trace_function_data_path = ""                     	# File to write trace data to.
trace_function_references = false                 	# Generate tracing for function address references.
trace_functions = false                           	# Generate tracing for function statistics.
validate_hir = false                              	# Perform validation checks on the HIR during compilation.
wfe_precise_sleep = false                         	# ARM64: busy-wait PreciseSleep's sub-millisecond tail on the generic-timer event stream (WFE) for exact deadlines. Off by default: the spin holds threads on-CPU (~18% in profiling) for frame-pacing precision that plain nanosleep matches in practice.
wfe_yield = true                                  	# ARM64: wait for the generic-timer event stream (WFE) instead of calling sched_yield() in guest yield/delay(0) spin loops. Avoids the syscall and lets the core idle in low power between polls (~10 kHz).
writable_code_segments = false                    	# Enables a program to write to its own code segments in memory.


[Config]
defaults_date = 2026080113                        	# Do not modify - internal version of the default values in the config, for seamless updates if default value of any option is changed.


