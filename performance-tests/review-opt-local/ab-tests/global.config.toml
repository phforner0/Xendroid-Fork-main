[Display]
fullscreen = false                                	# Whether to launch the emulator in fullscreen.
host_present_from_non_ui_thread = true            	# Allow the GPU emulation thread to present the guest output to the host surface directly instead of requesting the UI thread to do so through the host window system.
postprocess_antialiasing = ""                     	# Post-processing anti-aliasing effect to apply to the image output of the game.
postprocess_dither = true                         	# Dither the final image output from the internal precision to 8 bits per channel.
postprocess_ffx_cas_additional_sharpness = 0      	# Additional sharpness for AMD FidelityFX Contrast Adaptive Sharpening (CAS).
postprocess_ffx_fsr_max_upsampling_passes = 4     	# Maximum number of upsampling passes performed in AMD FidelityFX Super Resolution 1.0 (FSR).
postprocess_ffx_fsr_sharpness_reduction = 0.20000000298023224	# Sharpness reduction for AMD FidelityFX Super Resolution 1.0 (FSR).
postprocess_scaling_and_sharpening = ""           	# Post-processing effect to use for resampling and/or sharpening of the final display output.
present_letterbox = true                          	# Maintain aspect ratio when stretching by displaying bars around the image when there's no more overscan area to crop out.
present_render_pass_clear = true                  	# On graphics backends where this is supported, use the clear render pass load operation in presentation instead of clear commands clearing only the letterbox area.
present_safe_area_x = 90                          	# Percentage of the image width that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.
present_safe_area_y = 90                          	# Percentage of the image height that can be kept when presenting to maintain aspect ratio without letterboxing or stretching.
show_debug_overlay = false                        	# Show an on-screen debug overlay (FPS, instant/average frame time, and the number of shader/pipeline compiles currently in flight).


[GPU]
accurate_resolve_number_formats = false           	# Handle signed/integer resolve destination number formats and decode 8_8_8_8_GAMMA sources through the PWL curve during resolves.
                                                  	# Both are accuracy features that only a handful of titles need, but they are compiled into every full resolve shader, and the unused code costs registers and occupancy on mobile GPUs even when it never runs - measured at roughly a third of the frame rate in a resolve-heavy title.
                                                  	# Off uses lean resolve shaders that treat destinations as unsigned fractions, which is what the emulator did before. Enable only for a title with wrong resolve colours or gamma blowout.

anisotropic_override = -1                         	# Forces anisotropic filtering (AF) for eligible textures.
                                                  	# Higher values keep textures sharper at oblique angles at the cost of GPU bandwidth, though most GPUs handle up to 16x fine.
                                                  	# In rare cases, forcing AF can introduce visual artifacts.
                                                  	#  -1 = No override
                                                  	#   0 = Disable anisotropic filtering
                                                  	#   1 = Force 1x anisotropic filtering
                                                  	#   2 = Force 2x anisotropic filtering
                                                  	#   3 = Force 4x anisotropic filtering
                                                  	#   4 = Force 8x anisotropic filtering
                                                  	#   5 = Force 16x anisotropic filtering

async_shader_compilation = true                   	# Compile shaders and create pipelines asynchronously in background threads. Eliminates shader compilation stutter but may cause brief rendering artifacts while pipelines are being created. When disabled, pipelines are created synchronously which causes stutter but no visual artifacts.
async_shader_skip_draws = true                    	# Skip draws whose shaders can't render immediately via a placeholder (no interpreter stand-in, e.g. tessellation or textured/memexport/loop vertex shaders) until their real pipeline compiles in the background, instead of translating them on the draw thread. Avoids stutter but the geometry pops in a few frames later.
async_shader_vs_interpreter = true                	# Render new vertex shaders with the ucode interpreter while they translate and compile in the background, instead of stalling on translation. Requires async_shader_compilation.
async_shader_vs_interpreter_debug_color = false   	# Draw ucode interpreter VS placeholders with a flat grey pixel shader so the interim geometry is visible (host render target path only). Requires async_shader_vs_interpreter.
clear_memory_page_state = false                   	# Refresh state of memory pages to enable gpu written data. Uses mostly lock-free double-buffering for minimal overhead. (Enable if rendering breaks, at a minor performance cost)
depth_bias_shader_offset = false                  	# Route decal host render target draws with polygon offset through shader depth. This avoids Z-fighting in games that rely on tiny depth bias values that host fixed function depth bias cannot reproduce reliably.This likely causes some minor performance penalty, but the cost should be minimal if only a small portion of the scene is affected.
depth_float24_convert_in_pixel_shader = false     	# Whether to convert the depth values to 24-bit floating-point (20e4) from the host precision (32-bit floating point) directly in the pixel shaders of guest draws when using a host depth buffer.
                                                  	# This prevents visual artifacts (interleaved stripes of parts of surfaces rendered and parts not rendered, having either the same width in case of the "greater or equal" depth test function, or the former being much thinner than the latter with the "equal" function) if the full host precision depth data is lost.
                                                  	# This issue may happen if the game reloads the depth data previously evicted from the EDRAM to the RAM back to the EDRAM, but the EDRAM region that previously contained that depth buffer was overwritten by another depth buffer, or the game loads it to a different location in the EDRAM than it was previously placed at, thus Xenia is unable to restore the depth data with the original precision, and instead falls back to converting the lower-precision values, so in subsequent rendering passes for the same geometry, the actual depth values of the surfaces don't match those stored in the depth buffer anymore.
                                                  	# This is a costly option because it makes the GPU unable to use depth buffer compression, and also with MSAA, forces the pixel shader to run for every subpixel sample rather than for the entire pixel, making pixel shading 2 or 4 times heavier depending on the MSAA sample count.
                                                  	# The rounding direction is controlled by the depth_float24_round configuration variable.
                                                  	# Note that with depth_float24_round = true, this becomes even more costly because pixel shaders must be executed regardless of whether the surface is behind the previously drawn surfaces. With depth_float24_round = false, conservative depth output is used, however, so depth rejection before the pixel shader may still work.
                                                  	# If sample-rate shading is not supported by the host GPU, the conversion in the pixel shader is done only when MSAA is not used.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored because 24-bit depth is always used directly.

depth_float24_round = false                       	# Whether to round to the nearest even, rather than truncating (rounding towards zero), the depth when converting it to 24-bit floating-point (20e4) from the host precision (32-bit floating point) when using a host depth buffer.
                                                  	# false:
                                                  	#  Recommended.
                                                  	#  The conversion may move the depth values farther away from the camera.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   The "greater or equal" depth test function continues to work fine if the full host precision depth data is lost, it's still possible to draw another pass of the same geometry with it.
                                                  	#   (See the description of depth_float24_convert_in_pixel_shader for more information about full precision depth data loss.)
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Faster - the pixel shader for hidden surfaces may still be skipped (using conservative depth output).
                                                  	# true:
                                                  	#  Only for special cases of issues caused by minor 32-bit floating-point rounding errors, for instance, when the game tries to draw something at the camera plane by setting Z of the vertex position to W.
                                                  	#  The conversion may move the depth values closer or farther.
                                                  	#  Using the same rounding mode as in the Direct3D 9 reference rasterizer.
                                                  	#  Without depth_float24_convert_in_pixel_shader:
                                                  	#   Not possible to recover from a full host precision depth data loss - in subsequent passes of rendering the same geometry, half of the samples will be failing the depth test with the "greater or equal" depth test function.
                                                  	#  With depth_float24_convert_in_pixel_shader:
                                                  	#   Slower - depth rejection before the pixel shader is not possible.
                                                  	# When the depth buffer is emulated in software (via the fragment shader interlock / rasterizer-ordered view), this is ignored, and rounding to the nearest even is always done.

depth_transfer_not_equal_test = true              	# When transferring data between depth render targets, use the "not equal" test to avoid writing rewriting depth via shader depth output if it's the same as the one currently in the depth buffer in case of round trips of the data.
                                                  	# Settings this to true may make transfer round trips more friendly to depth compression depending on how the GPU implements it (as arbitrary depth output may result in it being disabled completely), which is beneficial to subsequent rendering, while setting this to false may reduce bandwidth usage during transfers as the previous depth won't need to be read.

disassemble_pm4 = false                           	# Only does anything in debug builds, if set will disassemble and log all PM4 packets sent to the CP.
draw_resolution_scale_threshold = 0               	# Surface pitch in pixels at or below render targets skip being upscaled by draw_resolution_scale_x/y. 0 disables it.
                                                  	# Small offscreen surfaces like bloom or depth of field buffers often break when upscaled and keeping them native avoids that. The pitch is compared after alignment to 80 pixel EDRAM tiles, so prefer conservative values, only as high as the broken effects need.
                                                  	# Host render targets only.

draw_resolution_scale_x = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# Values from 1 to 7 may be supported, depending on device capabilities. Requires sparse binding (Vulkan) or tiled resources (D3D12) for scales above 1x1. The emulator will automatically clamp to the maximum supported scale if the requested value exceeds device limits.
                                                  	# Various effects and parts of game rendering pipelines may work incorrectly as pixels become ambiguous from the game's perspective and because half-pixel offset (which normally doesn't affect coverage when MSAA isn't used) becomes full-pixel.

draw_resolution_scale_y = 1                       	# Integer pixel width scale used for scaling the rendering resolution opaquely to the game.
                                                  	# See draw_resolution_scale_x for more information.

draw_resolution_scaled_texture_offsets = true     	# Apply offsets from texture fetch instructions taking resolution scale into account for render-to-texture, for more correct shadow filtering, bloom, etc., in some cases.
dump_shaders = ""                                 	# For shader debugging, path to dump GPU shaders to as they are compiled.
execute_unclipped_draw_vs_on_cpu = true           	# Execute the vertex shader for draws with clipping disabled, primarily screen-space draws (such as clears), on the CPU when possible to estimate the extent of the EDRAM involved in the draw.
                                                  	# Enabling this may significantly improve GPU performance as otherwise up to the entire EDRAM may be considered used in draws without clipping, potentially resulting in spurious EDRAM range ownership transfer round trips between host render targets.
                                                  	# Also, on hosts where certain render target formats have to be emulated in a lossy way (for instance, 16-bit fixed-point via 16-bit floating-point), this prevents corruption of other render targets located after the current ones in the EDRAM by lossy range ownership transfers done for those draws.

execute_unclipped_draw_vs_on_cpu_for_psi_render_backend = true	# If execute_unclipped_draw_vs_on_cpu is enabled, execute the vertex shader for unclipped draws on the CPU even when using the pixel shader interlock (rasterizer-ordered view) implementation of the render backend on the host, for which no expensive copying between host render targets is needed when the ownership of a EDRAM range is changed.
                                                  	# If this is enabled, excessive barriers may be eliminated when switching between different render targets in separate EDRAM locations.

execute_unclipped_draw_vs_on_cpu_with_scissor = false	# Don't restrict the usage of execute_unclipped_draw_vs_on_cpu to only non-scissored draws (with the right and the bottom sides of the scissor rectangle at 8192 or beyond) even though if the scissor rectangle is present, it's usually sufficient for esimating the height of the render target.
                                                  	# Enabling this may cause excessive processing of vertices on the CPU, as some games draw rectangles (for their UI, for instance) without clipping, but with a proper scissor rectangle.

force_convert_line_loops_to_strips = false        	# For host graphics API downlevel support testing only, force CPU conversion of line loops to line strips even if the host supports line loop primitives natively.
force_convert_quad_lists_to_triangle_lists = false	# For host graphics API downlevel support testing only, force CPU conversion of quad lists to quad strips even if the host supports quad list primitives natively or via geometry shader emulation.
                                                  	# May also be useful for graphics debugging when the debugger doesn't display the geometry generated by geometry shaders properly.

force_convert_triangle_fans_to_lists = false      	# For host graphics API downlevel support testing only, force CPU conversion of triangle fans to triangle lists even if the host supports triangle fan primitives natively.
force_convert_triangle_strips_to_lists = false    	# Force CPU conversion of triangle strips to triangle lists. This may help diagnose rendering issues related to triangle strip handling.
framerate_limit = 0                               	# Host frame rate limit in FPS. 0 = unlimited.
                                                  	# Throttles presentation without affecting guest vblank timing.
                                                  	# Guest vblanks are controlled by use_50Hz_mode (50Hz PAL, 60Hz NTSC).
                                                  	# Defaults to 60 here rather than unlimited: the console never presented faster, and on a handheld the frames past the panel's refresh are heat and battery for no visible gain.

gamma_decode_pwl_resolve = true                   	# During 8_8_8_8_GAMMA MSAA color resolves, average the samples in linear space instead of averaging the encoded PWL gamma values directly.
                                                  	# This is separate from gamma_render_target_as_unorm16. It only applies when a full shader resolve reads an 8_8_8_8_GAMMA EDRAM color source. Compatible 8_8_8_8 destinations are written back as PWL gamma.
                                                  	# Leave enabled for games that otherwise look overexposed after gamma MSAA resolves. Disable only if it causes a title-specific regression.

gamma_render_target_as_unorm16 = true             	# When the host can't write 8 bits per component pixels with piecewise linear gamma encoding directly with correct blending, use the 16-bit unsigned normalized format, if supported, for conceptually correct 8_8_8_8_GAMMA render target format blending in linear color space. Greatly increases accuracy for this format, but may result in render target copying costs if the game switches between 8_8_8_8_GAMMA and 8_8_8_8 views for the same EDRAM render target.
gpu = "vulkan"                                    	# Graphics system. Use: [vulkan, null]
gpu_3d_to_2d_texture = true                       	# Handle shaders that sample 3D textures as 2D by creating a 2D texture from slice 0 of the guest memory.
gpu_allow_invalid_fetch_constants = true          	# Allow texture and vertex fetch constants with invalid type - generally unsafe because the constant may contain completely invalid values, but may be used to bypass fetch constant type errors in certain games until the real reason why they're invalid is found.
gpu_allow_invalid_upload_range = false            	# Allows games to read data from pages that are marked as no access.
gpu_debug_markers = false                         	# Insert debug markers into GPU command streams for tools like RenderDoc. Annotates draw calls with Xbox 360 GPU context (primitive type, shader hashes, vertex count, etc). Automatically enabled when RenderDoc is detected. Has minimal overhead when disabled.
gpu_stall_spin_iterations = 32                    	# How many times the command processor polls the ring buffer with a cheap yield before parking on the write-pointer event when the guest has produced no commands. The spin exists to dodge wake latency when the guest is about to kick again immediately, but on ARM64 the yield is a WFE that does not actually park on a busy SoC, so every iteration burns a core at full clock. 0 parks immediately; the event is signalled by UpdateWritePointer, so no wake-up is missed either way.
guest_display_refresh_cap = true                  	# Control guest vblank timing.
                                                  	#   true: Fixed rate vblanks (50Hz PAL, 60Hz NTSC based on use_50Hz_mode).
                                                  	#   false: Unlimited vblanks, allows the guest to run as fast as possible.

half_pixel_offset = true                          	# Enable support of vertex half-pixel offset (D3D9 PA_SU_VTX_CNTL PIX_CENTER). Generally games are aware of the half-pixel offset, and having this enabled is the correct behavior (disabling this may significantly break post-processing in some games), but in certain games it might have been ignored, resulting in slight blurriness of UI textures, for instance, when they are read between texels rather than at texel centers, or the leftmost/topmost pixels may not be fully covered when MSAA is used with fullscreen passes.
ignore_32bit_vertex_index_support = false         	# For host graphics API downlevel testing only (useful only for Qualcomm Adreno 4xx-level host GPU testing), force indirection or pre-masking and pre-swapping of 32-bit vertex indices as if the host only supports 24-bit indices.
log_gpu_frame_time_breakdown = false              	# Log a once-per-second breakdown of where the GPU command processor thread spends each guest frame (swap-to-swap): PM4 execution, draw processing, the swap itself, and idle stall waiting for ring writes. Diagnostic aid for frame pacing investigations.
log_gpu_frame_time_breakdown_passes = true        	# With log_gpu_frame_time_breakdown, also time every render pass and every resolve on the GPU (VkPassTime lines, resolve_ms). Each of those BOTTOM_OF_PIPE timestamps is a wait-for-idle on Turnip - hundreds per frame - so they distort what they measure (Forza Horizon on Adreno 825: 7.3 fps instrumented vs 12.7 fps plain). Disable to keep only the per-submission GPU busy/gap timestamps and the CPU-side GpuFrame stats, which are cheap enough to tell a GPU-bound frame from a CPU-bound one.
log_guest_driven_gpu_register_written_values = false	# Only does anything in debug builds, if set will log every write to a gpu register done by a guest. Does not log writes that are done by the CP on its own, just ones the guest makes or instructs it to make.
log_resolve_details = false                       	# Log a once-per-second histogram of resolve (EDRAM copy) operations: count and bytes per frame grouped by size, color/depth, MSAA, source and destination formats and direct-host vs staged path, plus destination address reuse within and across frames.
log_ringbuffer_kickoff_initiator_bts = false      	# Only does anything in debug builds, if set will log the pseudo-stacktrace of the guest thread that wrote the new read position.
memexport_await_fences = false                    	# Wait for the GPU to finish outstanding memory export before signalling a fence the guest reads, so exported data is in guest RAM by the time the guest looks at it. Disabling it avoids the stall but games reading exported data on the CPU may see stale contents. Needs memexport_enable. Off by default here: without the host buffer the wait is a full GPU stall per fence that cannot make the output visible anyway.
memexport_enable = false                          	# Make memory export output visible to the CPU by routing the draws that write it to a buffer aliasing guest RAM. Needed by games that read exported data on the CPU. Disabling it keeps the output in device-local memory, which is faster for the draws that consume it on the GPU. Applies at title launch. Off by default here: the host buffer needs VK_EXT_external_memory_host, which Turnip does not expose, so the import fails and the output stays device-local either way.
mrt_edram_used_range_clamp_to_min = true          	# With host render targets, if multiple render targets are bound, estimate the EDRAM range modified in any of them to be not bigger than the distance between any two render targets in the EDRAM, rather than allowing the last one claim the rest of the EDRAM.
                                                  	# Has effect primarily on draws without viewport clipping.
                                                  	# Setting this to false results in higher accuracy in rare cases, but may increase the amount of copying that needs to be done sometimes.

native_2x_msaa = true                             	# Use host 2x MSAA when available. Can be disabled for scalability testing on host GPU APIs where 2x is not mandatory, in this case, 2 samples of 4x MSAA will be used instead (with similar or worse quality and higher memory usage).
native_stencil_value_output = true                	# Use pixel shader stencil reference output where available for purposes like copying between render targets. Can be disabled for scalability testing, in this case, much more expensive drawing of 8 quads will be done.
no_discard_stencil_in_transfer_pipelines = false  	# Skip stencil bit discard in render target transfer pipelines. May improve performance on some GPUs.
non_seamless_cube_map = true                      	# Disable filtering between cube map faces near edges where possible (Vulkan with VK_EXT_non_seamless_cube_map) to reproduce the Direct3D 9 behavior.
occlusion_query = "fast"                          	# Controls hardware occlusion query behavior for EVENT_WRITE_ZPD.
                                                  	# Used for effects like lens flares, object culling, and auto-exposure.
                                                  	# Titles that use QueryBatch are not currently supported and fall back to
                                                  	# fake mode, regardless of this setting.
                                                  	#  fake: Write a fake result without asking the GPU. Safe for most games,
                                                  	#        though some effects may look slightly wrong.
                                                  	#  fast: Ask the GPU but don't wait for the answer. Writes a cached
                                                  	#        result immediately and updates it when the GPU catches up.
                                                  	#        Cached results bias toward visible when guessing. (default)
                                                  	#  fast-alt: Variant of fast mode that keeps cached zero results for
                                                  	#            unresolved reports. May improve effects relying on precise
                                                  	#            visibility, but may be less stable for occlusion culling.
                                                  	#  strict: Ask the GPU and wait for the real result before continuing.
                                                  	#          Most accurate, but may be somewhat less performant.

occlusion_query_fake_lower_threshold = 80         	# Lower end of the fake sample count value written on EVENT_WRITE_ZPD when real occlusion queries are disabled.
                                                  	# -1 writes nothing, resulting in some games that sit and hang.
                                                  	# 0 means the fake result stays fully occluded.

occlusion_query_fake_upper_threshold = 100        	# Upper end of the fake sample count value written on EVENT_WRITE_ZPD when real occlusion queries are disabled.
                                                  	# Keep this higher than occlusion_query_fake_lower_threshold.
                                                  	# Ignored if occlusion_query_fake_lower_threshold is -1.

occlusion_query_log = false                       	# Log occlusion query lifetime and summary stats.
occlusion_query_querybatch_range = 0              	# Range of fake sample count values to walk for titles using the
                                                  	# D3D QueryBatch standard before wrapping back to
                                                  	# occlusion_query_fake_lower_threshold. This shouldn't be changed
                                                  	# from the default value of 0 (disabled) unless necessary for a
                                                  	# specific title.

occlusion_query_saturation = 1                    	# Compress higher occlusion query sample counts before guest writeback.
                                                  	# This can be useful if effects such as lens flares appear too bright
                                                  	# or too strong.
                                                  	# 1.0 = default behavior
                                                  	# 0.0 = collapse all nonzero sample counts to 1
                                                  	# Values around 0.90 are a good starting point for subtle tuning.

pipeline_storage_precreate = true                 	# Create the pipelines described by previous runs when a title starts, so they do not compile mid-gameplay. Off still loads and reuses the stored shaders.
precise_interpolation = true                      	# Manually interpolate pixel shader inputs with barycentric coordinates to exactly match the guest and avoid hardware interpolation precision differences. Fixes noise artifacts in games like Perfect Dark and Tenchu Z that do exact equality comparisons on interpolated values. Requires fragment shader barycentric support (VK_KHR_fragment_shader_barycentric on Vulkan, SV_Barycentrics on Direct3D 12).
primitive_processor_cache_min_indices = 4096      	# Smallest number of guest indices to store in the cache to try reusing later in the same frame if processing (such as primitive type conversion or reset index replacement) is performed.
                                                  	# Setting this to a very high value may result in excessive CPU processing, while a very low value may result in excessive locking and lookups.
                                                  	# Negative values disable caching.

readback_resolve = "uma"                          	# Controls which render-to-texture resolves are copied back into guest RAM.
                                                  	#  uma: No copy - the CPU reads the host-mapped shared memory directly. The default, and the only mode that works on unified-memory GPUs (Adreno). Needs host-mapped shared memory and no resolution scaling.
                                                  	#  fast: Copy only resolves the CPU reads back
                                                  	#  all: Copy every resolve
                                                  	#  none: Disable readback completely (improves performance).

readback_resolve_half_pixel_offset = false        	# When resolution scaling is active, sample from the center of each scaled pixel block during readback resolve instead of the top-left corner. May improve image quality in some cases but can break games that rely on reading back specific pixel values (e.g., for gamma detection).
readback_resolve_sync = true                      	# Stall the GPU after each readback_resolve copy so guest RAM is coherent in the same frame, instead of copying asynchronously.
render_area_dirty_extent = false                  	# Shrink each render pass's area to the region its draws actually touch.
                                                  	# Host render targets span the whole EDRAM range for their pitch, so a narrow one is thousands of rows tall. SHELVED: measured on Adreno 650 / Turnip this changes nothing - shrinking 80x8192 to 32x32 left pass times and the RB/CCU/UBWC counters identical, so the driver was already skipping the empty tiles rather than binning them. Kept for other drivers and as groundwork; off by default because it buys nothing here.

render_target_path = "performance"                	# Render target emulation path to use across all GPU backends.
                                                  	# Use: [performance, accuracy]
                                                  	#  performance:
                                                  	#   Host render targets and fixed-function blending and depth/stencil testing, copying between render targets when needed.
                                                  	#   Lower accuracy (limited pixel format support).
                                                  	#   Performance limited primarily by render target layout changes requiring copying, but generally higher.
                                                  	#   Maps to 'fbo' on Vulkan and 'rtv' on D3D12.
                                                  	#  accuracy:
                                                  	#   Manual pixel packing, blending and depth/stencil testing, with free render target layout changes.
                                                  	#   Requires GPU supporting fragment shader interlock (Vulkan) or rasterizer-ordered views (D3D12).
                                                  	#   Highest accuracy (all pixel formats handled in software).
                                                  	#   Performance limited primarily by overdraw.
                                                  	#   Maps to 'fsi' on Vulkan and 'rov' on D3D12.

resolve_check_number_format = true                	# Require the destination number format to match before using fast color resolves.
                                                  	# Fast resolves copy the exact EDRAM bits. If a title resolves unsigned color data to a signed or integer destination, enabling this forces full resolves in the shader so the destination gets repacked instead.

resolve_copy_dest_number_packing = false          	# Pack full-resolve fixed destinations according to copy_dest_number instead of assuming an unsigned fraction.
                                                  	# Off restores the pre-upstream packing and keeps signed/integer destinations eligible for the raw fast copy. Only has an effect with accurate_resolve_number_formats on; the lean shaders ignore the destination number format entirely.

resolve_resolution_scale_fill_half_pixel_offset = true	# When using resolution scaling, apply the hack that stretches the first surely covered host pixel in the left and top sides of render target resolve areas to eliminate the gap caused by the half-pixel offset (this is necessary for certain games to display the scene graphics).
rt_cache_ownership_claim_memo = true              	# Skip EDRAM ownership-map walks for render target claims that provably change nothing (the same render target re-claiming an extent it already fully owns, with no ownership mutation since), and skip the transfer/resolve-clear pass entirely when no draw produced any ownership transfers. Disable for debugging render target transfer issues.
shader_profiling = false                          	# Log shader translation and host pipeline (PSO) creation timings, tagged with 'shader_profiling:'. Off by default because it logs per shader and per pipeline.
shared_memory_zero_copy = true                    	# Alias guest RAM directly as the GPU shared-memory buffer instead of uploading dirty pages each frame. Removes upload copies and keeps memexport and resolve output coherent with the CPU for free. Default on for ARM64 (unified-memory) builds, off for x86-64. Turn off on discrete GPUs, where shared-memory fetches cross PCIe and are slow.
snorm16_render_target_full_range = true           	# When the host can only support 16_16 and 16_16_16_16 render targets as -1...1, remap -32...32 to -1...1 to use the full possible range of values, at the expense of multiplicative blending correctness.
spirv_disable_rounding_mode_rte = false           	# Disable RoundingModeRTE capability in SPIR-V shaders. Enable this to allow shader debugging in RenderDoc, which doesn't support this capability.
spirv_moltenvk_allow_contraction = true           	# When translating SPIR-V for MoltenVK, omit NoContraction decorations so SPIRV-Cross doesn't emit MSL NoContraction helper wrappers with [[clang::optnone]]. Other Vulkan drivers keep NoContraction enabled.
spirv_multiply_zero_test_on_bits = false          	# Test multiply operands for zero on their raw bits instead of as min(|a|, |b|) == 0.0 when emulating Shader Model 3 zero semantics.
                                                  	# Both forms are equivalent, but Mesa folds the float one into nir_op_fmulz and then nir_op_fmadz, which the Adreno ir3 compiler does not implement - it aborts shader compilation (Project Gotham Racing 3, Dark Souls on a8xx). Enable for titles whose shaders fail to compile that way.

spirv_specialize_no_alpha = true                  	# Specialize host-render-target pixel shaders for draws with alpha test and alpha-to-coverage disabled. Omits the unused alpha epilogue and sample-mask output without forcing early depth/stencil tests. Disable for an A/B comparison with the generic shader variant.
spirv_switch_case_jump_fallthrough = false        	# Re-enter the main loop instead of falling through into the next control flow block, working around an NVIDIA shader compiler bug that turns an OpSwitch case fall-through into a non-terminating loop. Costs a loop iteration and a switch dispatch at every block boundary a shader used to run straight through, which is expensive where fragment shading is the bottleneck.
spirv_version_override = "1.0"                    	# Override the SPIR-V version used in shader translation.
                                                  	# Use: [1.0, 1.3, 1.4, 1.5, 1.6, auto]
                                                  	#  1.0: SPIR-V 1.0 (Vulkan 1.0) (default)
                                                  	#  1.3: SPIR-V 1.3 (Vulkan 1.1)
                                                  	#  1.4: SPIR-V 1.4 (Vulkan 1.1 with KHR_spirv_1_4 extension)
                                                  	#  1.5: SPIR-V 1.5 (Vulkan 1.2+)
                                                  	#  1.6: SPIR-V 1.6 (Vulkan 1.3+)
                                                  	#  auto: Test for SPIR-V 1.5 support, fall back to 1.0

store_shaders = true                              	# Store shaders persistently and load them when loading games to avoid runtime spikes and freezes when playing the game not for the first time.
submit_on_primary_buffer_end = true               	# Submit the command buffer when a PM4 primary buffer ends if it's possible to submit immediately to try to reduce frame latency.
target_trace_file = ""                            	# Specifies the trace file to load.
texture_cache_memory_limit_hard = 768             	# Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.
texture_cache_memory_limit_render_to_texture = 24 	# Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.
                                                  	# If texture_cache_memory_limit_soft, for instance, is 384, and this is 24, it will be assumed that the game will be using roughly 24 MB of render-to-texture (resolve) targets and 384 - 24 = 360 MB of regular textures - so with 2x2 resolution scaling, the soft limit will be 360 + 96 MB, and with 3x3, it will be 360 + 216 MB.

texture_cache_memory_limit_soft = 384             	# Maximum host texture memory usage (in megabytes) above which old textures will be destroyed.
texture_cache_memory_limit_soft_lifetime = 30     	# Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds texture_cache_memory_limit_soft.
texture_gradient_exp_bias = false                 	# Apply the per-axis gradient exponent biases (LodBiasH/V, word 4 of the fetch constant) when sampling with computed gradients. The biases are zero in most games, and honoring them costs a handful of integer ops plus two multiplies in every gradient texture fetch, which is measurable where fragment shading is the bottleneck.
texture_integer_num_format = false                	# Honour the texture fetch constant's integer num_format bit by scaling sampled components back to guest integer units (x255 for 8-bit, x65535 for 16-bit). Costs a per-component rescale inside every texture fetch that requests it, which is measurable where fragment shading is the bottleneck. Off samples everything as normalized, which is what the emulator did before upstream implemented this.
tiled_shared_memory = true                        	# Enable tiled/sparse resources for efficient large address space support. Disable for graphics debugger compatibility.
trace_dump_path = ""                              	# Output path for dumped files.
trace_gpu_prefix = "scratch/gpu/"                 	# Prefix path for GPU trace files.
trace_gpu_stream = false                          	# Trace all GPU packets.
use_fuzzy_alpha_epsilon = false                   	# Use approximate compare for alpha values to prevent flickering on NVIDIA graphics cards
value_convert_7e3_8888_reuse = true               	# Decode (HDR float to LDR unorm) instead of bit-reinterpreting when a 7e3 (2_10_10_10_FLOAT) EDRAM tile is reused in place as 8_8_8_8 and the reusing draw blends over it, so the background is not colored garbage (e.g. Deadly Premonition foliage).
                                                  	# On by default. Set to false to force bit-exact reinterpretation if a title regresses.

vulkan_mid_frame_submission_draws = 1300          	# If greater than 0, end and submit the current command buffer after this many draws instead of only at the swap, so the GPU overlaps the frame's rendering with the building of the rest of its command stream. 0 keeps one submission per frame. Splitting closes the current render pass, so values that are too small hurt tiled GPUs; try roughly half the title's per-frame draw count.


[General]
allow_game_relative_writes = false                	# Not useful to non-developers. Allows code to write to paths relative to game://. Used for generating test data to compare with original hardware. 
allow_plugins = false                             	# Allows loading of plugins/trainers from plugins\title_id\plugin.xex. Plugin are homebrew xex modules which can be used for making mods. This feature is experimental.
apply_patches = true                              	# Enables custom patching functionality
controller_hotkeys = false                        	# Hotkeys for Xbox and PS controllers.
debug = false                                     	# Allow debugging and retain debug information.
disable_doubleclick_fullscreen = false            	# Allows the user to disable the behavior where a fast double-click causes Xenia to enter fullscreen mode.
discord = false                                   	# Enable Discord rich presence
dump_xex = false                                  	# Dump the main XEX to current directory on launch
guest_crash_is_fatal = true                       	# When a guest thread crashes (unhandled access violation or illegal instruction in JIT'd guest code), log a full crash report and terminate the emulator instead of silently parking the faulted thread - which starves the rest of the guest and shows up as a hang. Disable to keep the thread parked for post-mortem inspection.
launch_module = ""                                	# Executable to launch from the .iso or the package instead of default.xex or the module specified by the game. Leave blank to launch the default module.
priority_class = 0                                	# Forces Xenia to use different process priority than default one. It might affect performance and cause unexpected bugs. Possible values: 0 - Normal, 1 - Above normal, 2 - High
recent_titles_entry_amount = 10                   	# Allows user to define how many titles is saved in list of recently played titles.
time_scalar = 1                                   	# Scalar used to speed or slow time (1x, 2x, 1/2x, etc).


[HID]
guide_button = true                               	# Forward guide button presses to guest.
hid = "android"                                   	# Input system. Use: [android, nop]
left_stick_deadzone_percentage = 0                	# Defines deadzone level for left stick. Allowed range [0.0-1.0].
right_stick_deadzone_percentage = 0               	# Defines deadzone level for right stick. Allowed range [0.0-1.0].
show_touch_overlay = true                         	# Draw the on-screen controller. Seeded on first launch from whether a physical controller was attached, and honoured as-is after that.
vibration = true                                  	# Toggle controller vibration.


[Kernel]
allow_avatar_initialization = false               	# Enable Avatar Initialization
                                                  	# Only set true when testing Avatar games. Certain games may crash due to requirement of full avatar implementation.

allow_incompatible_title_update = true            	# Allow title updates with mismatched signatures to be applied.
apply_title_update = true                         	# Apply title updates.
auto_reset_event_handoff = false                  	# Strict NT SetEvent semantics for auto-reset events (directed FIFO hand-off to a parked waiter). Can regress synchronization timing, so it is off by default; the handshake deadlock it was added for is fixed by the scheduler's targeted wakes instead.
cl = ""                                           	# Specify additional command-line provided to guest.
console_type = -1                                 	# Console Type Identifier: -1 - Retail, 0 - Development Kit, 1 - Test Kit
default_achievements_backend = "GPD"              	# Defines which achievements backend should be used as an default. Possible options: GPD.
fiber_reentry_longjmp = true                      	# POSIX: reenter guest fiber stacks (KeSetCurrentStackPointers) with setjmp/longjmp instead of a C++ exception, avoiding a full DWARF unwind per fiber switch (~10% CPU in fiber-heavy guest job systems). Plain host threads only; the cooperative scheduler keeps the exception path.
guest_scheduler = true                            	# Run guest threads as cooperative fibers driven by an in-kernel scheduler instead of mapping each to its own host OS thread. Requires a restart to take effect.
guest_scheduler_quantum_us = 1000                 	# Cooperative-scheduler timeslice in microseconds. A guest fiber running this long yields at its next JIT safepoint so co-resident fibers on the same dispatch thread make progress. Lower is fairer but switches more.
guest_scheduler_stats = false                     	# Log guest scheduler counters once a second: blocked-waiter re-poll rate, fiber switches, forced preemptions, and how long offloaded blocking calls queue behind the single I/O worker.
ignore_thread_affinities = true                   	# Ignores game-specified thread affinities.
ignore_thread_priorities = true                   	# Ignores game-specified thread priorities.
in_process_title_relaunch = true                  	# Handle title-to-title launches in-process via full Shutdown/Setup cycle instead of spawning a new emulator process.
kernel_build_version = 1888                       	# Define current kernel version
kernel_cert_monitor = false                       	# Enable cert monitor.
kernel_debug_monitor = false                      	# Enable debug monitor.
kernel_display_gamma_power = 2.22222233           	# Display gamma to use with kernel_display_gamma_type 3.
kernel_display_gamma_type = 2                     	# Display gamma type: 0 - linear, 1 - sRGB (CRT), 2 - BT.709 (HDTV), 3 - power specified via kernel_display_gamma_power.
kernel_pix = false                                	# Enable PIX.
network_enabled = true                            	# Let titles open host sockets. The XNet address and session layer is stubbed, so guest traffic cannot reach a peer, but titles that do not check for socket creation failure crash outright when this is off. Turn it off only for titles that block indefinitely on a socket that never answers.
precise_guest_delays = true                       	# Serve KeDelayExecutionThread with a sub-millisecond-accurate host wait instead of a plain sleep. Guest frame-pacing sleeps sit on the frame critical path, and a plain host sleep overshoots by the scheduler wakeup latency, inflating frame time directly.
staging_mode = false                              	# Enables preview mode in dashboards to render debug information.


[Logging]
flush_log = true                                  	# Flush log file after each log line batch.
log_file = ""                                     	# Logs are written to the given file
log_high_frequency_kernel_calls = false           	# Log kernel calls with the kHighFrequency tag.
log_level = 2                                     	# Maximum level to be logged. (0=error, 1=warning, 2=info, 3=debug)
log_mask = 0                                      	# Disables specific categorizes for more granular debug logging. Kernel = 1, Apu = 2, Cpu = 4, Gpu = 8.
log_sessions_keep = 4                             	# Number of past sessions whose logs (xenia log + logcat) are kept as zips in <storage>/logs, rotated at session start.
log_string_format_kernel_calls = false            	# Log usage of print formatters like sprintf.
log_to_debugprint = false                         	# Dump the log to DebugPrint.
log_to_stdout = true                              	# Write log output to stdout


[Memory]
ignore_offset_for_ranged_allocations = false      	# Allows to ignore 4k offset for physical allocations with provided range. Certain titles check if result matches provided lower range.
mmap_address_high = 8                             	# 1-124
protect_on_release = false                        	# Protect released memory to prevent accesses.
protect_zero = true                               	# Protect the zero page from reads and writes.
scribble_heap = false                             	# Scribble specific or random value into all allocated heap memory.
scribble_heap_value = 0                           	# Value used to fill all allocated heap memory. 0 - Random value. Valid range: [1-255]
writable_executable_memory = true                 	# Allow mapping memory with both write and execute access, for simulating behavior on platforms where that's not supported


[Profiles]
logged_profile_slot_0_xuid = "E030000070779EA0"   	# XUID of the profile to load on boot in slot 0
logged_profile_slot_1_xuid = ""                   	# XUID of the profile to load on boot in slot 1
logged_profile_slot_2_xuid = ""                   	# XUID of the profile to load on boot in slot 2
logged_profile_slot_3_xuid = ""                   	# XUID of the profile to load on boot in slot 3


[Storage]
cache_root = ""                                   	# Root path for files used to speed up certain parts of the emulator or the game. These files may be persistent, but they can be deleted without major side effects such as progress loss. If empty, the cache folder under the storage root, or, if available, the cache directory preferred for the OS, will be used.
content_root = ""                                 	# Root path for guest content storage (saves, etc.), or empty to use the content folder under the storage root.
force_mount_devkit = false                        	# Force devkit mount
mount_cache = false                               	# Enable cache mount
mount_memory_unit = false                         	# Enable memory unit (MU) mount
mount_scratch = false                             	# Enable scratch mount
storage_root = ""                                 	# Root path for persistent internal data storage (config, etc.), or empty to use the path preferred for the OS, such as the documents folder, or the emulator executable directory if portable.txt is present in it.


[UI]
achievement_notification_position_by_game = false 	# Use game-specified notification position for achievements. When disabled, achievements always appear at center-bottom.
achievement_sound_path = ""                       	# Path (including filename) to achievement unlock sound. Supports WAV, MP3, OGG, FLAC, and other common formats.
android_disc_swap = true                          	# Ask which disc to insert when a multi-disc game requests one, instead of leaving the drive empty.
android_message_box = true                        	# Show a game's message boxes as an Android dialog, instead of answering them with the button the game pre-selected.
android_soft_keyboard = true                      	# Show the Android keyboard when a game asks for text input, instead of answering the prompt with its default text.
custom_font_path = ""                             	# Path to custom font file (overrides the embedded UI font). Empty uses the bundled Inter font.
font_size = 13                                    	# Allows user to set custom font size.
headless = true                                   	# Don't display any UI, using defaults for prompts as needed.
profiler_dpi_scaling = false                      	# Apply window DPI scaling to the profiler.
show_achievement_notification = true              	# Show achievement notification on screen.
show_profiler = false                             	# Show profiling UI by default.
storage_selection_dialog = false                  	# Show storage device selection dialog when the game requests it.


[Video]
avpack = 8                                        	# Video modes
                                                  	#  0 = PAL-60 Component (SD)
                                                  	#  1 = Unused
                                                  	#  2 = PAL-60 SCART
                                                  	#  3 = 480p Component (HD)
                                                  	#  4 = HDMI+A
                                                  	#  5 = PAL-60 Composite/S-Video
                                                  	#  6 = VGA
                                                  	#  7 = TV PAL-60
                                                  	#  8 = HDMI (default)

enable_3d_mode = false                            	# Enables usage of stereoscopic mode in titles.
interlaced = false                                	# Toggles interlaced mode.
internal_display_resolution_x = 1280              	# Custom width. See internal_display_resolution. Range 1-1920.
internal_display_resolution_y = 720               	# Custom height. See internal_display_resolution. Range 1-1080.


[Vulkan]
adrenotools_force_max_clocks = true               	# Custom Driver Force Max Clocks
fd_dev_features = ""                              	# FD_DEV_FEATURES overrides for the Turnip driver. Empty auto-detects the vendor OSes whose framebuffer stack needs enable_tp_ubwc_flag_hint=1 (Samsung One UI, Xiaomi HyperOS/MIUI); set 'none' to inject nothing.
ir3_debug = ""                                    	# Comma-separated IR3_DEBUG flags for the Turnip shader compiler, e.g. nopreamble or noearlypreamble to keep uniform math out of the shader preamble. Empty leaves IR3_DEBUG unset.
turnip_debug = "sysmem"                           	# TU_DEBUG flags passed to the Turnip (Mesa freedreno) Vulkan driver, comma-separated. 'sysmem' (the default) forces sysmem (untiled) rendering, which masks a class of tiled-rendering (GMEM) artifacts and Adreno GPU hangs - but only on Turnip; proprietary drivers ignore it, so the underlying command-stream bugs must be fixed rather than hidden. Empty leaves TU_DEBUG unset.
turnip_perf_sampler = ""                          	# Enable the instrumented Turnip build's whole-GPU KGSL performance counter sampler. Empty disables it. "1" samples the default triage set; "tp" swaps in the deeper texture-unit set (TP has only 12 physical slots, so the two sets are mutually exclusive).
                                                  	# Requires a Turnip build containing the sampler; ignored otherwise.

turnip_perf_sampler_file = ""                     	# Report path for turnip_perf_sampler. Empty writes to the app's files directory as tu_perf.log.
turnip_perf_sampler_period_ms = 100               	# Poll period in milliseconds for turnip_perf_sampler.
vulkan_allow_present_mode_fifo_relaxed = true     	# When available, allow the relaxed first-in-first-out presentation mode (3rd priority), which causes waiting for host display vertical sync, but may present with tearing if frames don't meet the host display refresh rate.
vulkan_allow_present_mode_immediate = true        	# When available, allow the immediate presentation mode (1st priority), offering the lowest latency with the possibility of tearing in certain cases, and, depending on the configuration, variable refresh rate.
vulkan_allow_present_mode_mailbox = true          	# When available, allow the mailbox presentation mode (2nd priority), offering low latency without the possibility of tearing.
vulkan_allow_reverse_z = true                     	# Pass viewports with minDepth > maxDepth (reverse depth ranges, used by many games for inverse-Z) directly to the driver. Vulkan allows this, but some drivers mishandle it (the Direct3D 12 backend always normalizes, citing drivers where it works and drivers where it doesn't). Disable to normalize the range and compensate in the NDC transform like the D3D12 backend does.
vulkan_async_skip_draws = true                    	# With asynchronous shader compilation: don't wait for pipeline creation at the submission boundary - draws whose pipeline hasn't finished compiling yet are dropped for that submission (brief pop-in of new objects instead of any wait). When false, the GPU thread waits at the end of each submission until every pipeline it recorded is ready, so no draw is ever lost.
vulkan_avoid_geometry_shaders = true              	# Route guest primitives that would otherwise need a geometry shader through cheaper host paths on tile-based GPUs (Adreno/Turnip), where the geometry-shader stage serializes the binning pass. Applies to point sprites (expanded in the vertex shader as a triangle strip) and quad lists (expanded on the CPU to a triangle list). Rectangle lists always stay on the geometry shader. Read once at GPU initialization, so a change takes effect on emulator restart. Disable for byte-identical pre-optimization (geometry-shader) behavior and A/B debugging.
vulkan_cache_sampler_parameters = true            	# Reuse sampler parameters and VkSampler handles across draws, re-deriving them only for fetch constants written since the previous draw (or on shader sampler-layout change, new submission, or sampler destruction). Disable to derive and look up every sampler on every draw (pre-optimization behavior).
vulkan_cache_texture_descriptors = true           	# Skip re-writing and re-binding the texture/sampler descriptor sets on draws whose resolved image views and samplers have not changed since the last write. Disable to force a descriptor-set write and bind every draw (pre-optimization behavior) for debugging texture corruption.
vulkan_clamp_storage_buffer_range = 0             	# If > 0, clamp the reported maxStorageBufferRange to this many bytes. Drivers reporting very large limits get a single 512 MB storage buffer binding for shared memory emulation; clamping to 134217728 (128 MB) forces the split 4-binding path (what Turnip uses) for debugging driver-specific large-binding misbehavior.
vulkan_deferred_cmd_size_cursor = true            	# Track the deferred command buffer's recorded length with a size cursor over a geometrically grown buffer instead of resizing the vector per recorded command (vector::resize zero-fill was ~2% of the GPU command processor thread).
vulkan_depth_unorm24 = true                       	# Use the native D24_UNORM_S8_UINT format for guest 24-bit depth when the driver supports it. Disable to force the float32 depth emulation path (what drivers without unorm24 support, like Adreno proprietary, always use) for debugging.
vulkan_device = -1                                	# Index of the preferred Vulkan physical device, or -1 to use any compatible device.
vulkan_direct_host_resolve = true                 	# Resolve eligible (non-format-converting and packable format-converting) host render targets directly to guest memory with compute shaders instead of first dumping the host render target back through EDRAM. Avoids a render-pass break and a DRAM round-trip on the resolve path. Ineligible cases (gamma, unsupported formats, multi-sample selects) fall back to the EDRAM dump path. Disable to always use the EDRAM dump path.
vulkan_dynamic_constant_buffers = false           	# Bind the guest constant buffers as VK_DESCRIPTOR_TYPE_UNIFORM_BUFFER_DYNAMIC so only the per-draw dynamic offsets vary; the constants descriptor set is re-allocated and re-written only when an upload-pool page rolls over. DEFAULT OFF: on Qualcomm proprietary Vulkan drivers (Adreno 650/740/830 tested, 2026-06) shaders read ZEROS through the dynamic-offset uniform descriptors, breaking all rendering (black output / garbage), proven by RenderDoc pixel-history bisection; Mesa/Turnip reads them correctly. Safe to enable on Turnip for a small command-processor win. Has no effect on devices that report maxDescriptorSetUniformBuffersDynamic < 7 (the guest constant-buffer count).
vulkan_dynamic_pipeline_state = true              	# Use VK_EXT_extended_dynamic_state (and state 2/3 where available) to move cull/front-face/topology/depth/stencil/blend out of the baked pipeline key into dynamic state, collapsing pipeline permutations and reducing shader compilation stutter. Disable to fall back to fully static pipelines.
vulkan_dynamic_rendering = true                   	# Use VK_KHR_dynamic_rendering instead of traditional render passes. May improve or worsen performance depending on driver. Requires Vulkan 1.3 or VK_KHR_dynamic_rendering extension support.
vulkan_fast_register_ranges = true                	# Process PM4 register range writes with bulk byte-swapped copies and range-level constant dirty tracking (port of the D3D12 backend's register-write fast path) instead of a virtual per-register call. Disable to route every register through WriteRegister (pre-optimization behavior).
vulkan_fast_sampler_filterability = true          	# Derive host linear-filterability for samplers directly from the fetch constant instead of building the full texture binding info (texture key + host format pair) per sampler per draw. Results are identical; disable for A/B debugging of texture filtering issues.
vulkan_hoist_shmem_uploads = true                 	# Record shared-memory uploads whose pages were not invalidated since the current submission opened at the start of the submission's command buffer instead of breaking the current render pass (expensive on tile-based GPUs).
vulkan_in_pass_resolve = false                    	# Prepare color attachments for in-pass EDRAM resolves with VK_KHR_dynamic_rendering_local_read: RENDERING_LOCAL_READ image layout and input-attachment usage on color render targets. Requires dynamic rendering and driver support; no effect otherwise.
vulkan_in_pass_resolve_debug_dump = false         	# DEBUG probe: still dump the owning render targets to the EDRAM buffer when a resolve was performed in-pass, to test whether skipping the dump is what a title misses.
vulkan_in_pass_resolve_debug_exp_bias = 0         	# DEBUG probe: add this to the destination exponent bias of in-pass resolves only. Nonzero must visibly change the image if their output is consumed; identical output means the data is not the conduit.
vulkan_in_pass_resolve_debug_read_usage = false   	# DEBUG probe: declare shared memory as kRead rather than kGuestDrawReadWrite for guest passes even when local-read attachments are enabled. kRead covers COMPUTE/TRANSFER stages that kGuestDrawReadWrite does not.
vulkan_in_pass_resolve_debug_reject = 0           	# DEBUG probe bitmask: 1 = reject multisampled sources, 2 = reject single-sampled sources. For bisecting which resolve population carries an artifact.
vulkan_in_pass_transfers = true                   	# Queue compatible render-target ownership transfers for execution inside the guest draw render pass instead of breaking the pass to perform them. On tile-based GPUs (Adreno/Turnip) this avoids GMEM store/restore cycles, and for provably full-overwrite targets it also discards (DONT_CARE) the old attachment contents. Disable to restore the always-break behavior.
vulkan_lib_path = "/data/user/0/xendroid.compose.fork.opt/compose/driver/Turnip_Gen8_V36/libvulkan_freedreno.so"	# Custom Driver Library Path
vulkan_log_debug_messages = false                 	# Write Vulkan VK_EXT_debug_utils messages to the Xenia log, as opposed to the OS debug output.
vulkan_normalize_dontcare_keys = true             	# Keep the loadOp discard bits out of framebuffer and pipeline cache keys under dynamic rendering, so toggling them cannot force a render pass break. Disable for A/B measurement of the break count.
vulkan_pipeline_creation_threads = 4              	# Number of threads used for graphics pipeline creation. -1 to calculate automatically (75% of logical CPU cores), a positive number to specify the number of threads explicitly (up to the number of logical CPU cores), 0 to disable multithreaded pipeline creation.
vulkan_placeholder_pipelines = false              	# Asynchronous shader compilation async model (A/B). Default false: the fork's deferred-bind model - no placeholder is created, the pipeline slot stays VK_NULL_HANDLE, the command processor records a deferred bind of the stable slot pointer, and the submission boundary either waits for creation (vulkan_async_skip_draws=false) or drops the draws of still-unready pipelines at replay. Preferred because the skipped-draw pop-in is smoother than the jarring artifacts produced by the placeholder pipeline. When true, upstream xenia-edge's model is used instead: an immediate placeholder pipeline (no-op pixel shader, or a ucode-interpreter vertex shader) is created and hot-swapped for the real pipeline when it finishes compiling - the draw renders through the placeholder meanwhile. Both share the async_shader_compilation master switch and the creation threads.
vulkan_rebar = false                              	# Use ReBAR/SAM (Resizable BAR / Smart Access Memory) for upload buffers when available. This places staging buffers in GPU VRAM. May improve or hurt performance depending on hardware - traditional staging via system memory is often faster due to async GPU DMA.
vulkan_renderdoc_capture = false                  	# Request the VK_LAYER_RENDERDOC_Capture layer at instance creation for frame capturing. Requires the RenderDoc layer library to be bundled in the APK; attach from qrenderdoc with 'Attach to Running Instance'.
vulkan_resolve_clear_in_guest_pass = true         	# Perform the clear part of an EDRAM resolve inside the last guest render pass when the cleared depth/color targets are its attachments, instead of opening a separate single-attachment pass per cleared target (and then reopening the guest pass for the next draw). Removes up to two render passes per resolve-with-clear, which on tile-based GPUs each cost a flush and a pipeline drain. Disable to restore the per-target clear passes.
vulkan_resolve_to_texture = true                  	# Have the in-pass resolve also store its result straight into the promoted destination texture, so vulkan_resolve_to_texture_serve can skip the upload that would re-read the same bytes from guest memory.
vulkan_resolve_to_texture_promote = true          	# Allocate textures that an in-pass resolve writes with STORAGE usage and a uint alias view, so the resolve can write them directly. Changes nothing on its own, but costs framebuffer compression on those textures.
vulkan_resolve_to_texture_serve = true            	# Skip the compute upload for textures an in-pass resolve already filled this frame. This is where the round-trip upload traffic disappears; requires vulkan_resolve_to_texture_promote and vulkan_resolve_to_texture.
vulkan_shared_memory_host_visible = true          	# On unified-memory GPUs (Adreno, integrated), allocate the shared-memory buffer from a host-visible cached memory type and map it so resolve readback (readback_resolve=uma) can read guest memory directly without a GPU staging copy. Only applies to the dense (non-sparse) buffer. Measured on Adreno 830 / Turnip in TDU2: +11.6% fps (22.6 -> 25.2, p<0.001), from dropping ~153 staging copies per frame. Pass breaks shift (resolve readback breaks out, texture-upload breaks in) but net out, and per-submission GPU time barely moves - the win is bandwidth, not pass structure.
vulkan_skip_redundant_fetch_constant_writes = true	# Don't invalidate texture bindings and the fetch/bool-loop constant buffers when a register write doesn't change the register's value. Games commonly re-emit identical fetch constants every draw, and the derived state is a pure function of the register contents.
vulkan_sparse_shared_memory = true                	# Enable sparse binding for shared memory emulation. Disabling it increases video memory usage - a 512 MB buffer is created - but allows graphics debuggers that don't support sparse binding to work.
vulkan_texture_descriptor_reuse_edge = false      	# When vulkan_cache_texture_descriptors is on, use upstream edge's bitmask+shader-pointer+sampler-vector descriptor-set reuse gate instead of XenDroid's content-hash gate. For A/B comparison; default false = the hash gate.
vulkan_validation = 0                             	# Vulkan validation level. 0=off, 1=standard (VK_LAYER_KHRONOS_validation: API correctness, object lifetime, parameter checks), 2=+synchronization validation (catches missing barriers and RAW/WAW hazards; 2-5x slowdown), 3=+GPU-assisted (catches OOB shader buffer accesses; 3-10x slowdown). Messages go to the Xenia log if 'vulkan_log_debug_messages' is enabled, or to the OS debug output otherwise.


[a64]
a64_enable_host_guest_stack_synchronization = true	# Records entries for guest/host stack mappings at function starts and checks for reentry at return sites. Has slight performance impact, but fixes crashes in games that use setjmp/longjmp.
a64_extension_mask = -1                           	# Allow the detection and utilization of specific instruction set features.
                                                  	#     0 = armv8.0
                                                  	#     1 = Large System Extensions(LSE) atomic operations
                                                  	#     2 = FPCR.FZ flushes denormal inputs (skip software flush)
                                                  	#    -1 = Detect and utilize all possible processor features

a64_max_stackpoints = 65536                       	# Max number of host->guest stack mappings we can record.
a64_vmx_nan_fixup = true                          	# Emulate PPC NaN propagation on VMX float ops: the first NaN operand (by position) is returned, quieted; generated NaNs become the PPC default NaN (0xFFC00000). When disabled, the IEEE/NEON default NaN behavior is used instead, which matches the x64 backend and is faster; rare titles that hash or compare raw float bits may behave differently.
