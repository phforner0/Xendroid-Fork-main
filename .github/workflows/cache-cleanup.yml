name: Cache cleanup

on:
  workflow_run:
    workflows: [XenDroid]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
    - name: Drop stale caches (keep newest per key and branch)
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -uo pipefail

        gh cache list --limit 500 --json id,key,ref,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[] | "\(.id)\t\(.ref)\t\(.key)"' > caches.tsv

        # Keys differ per run by a trailing hash or a timestamp (ccache-action);
        # caches are scoped to their branch, so a pull request's newer cache
        # must not replace main's.
        seen=""
        deleted=0
        while IFS=$'\t' read -r id ref key; do
          [ -n "${id:-}" ] || continue

          base=$(printf '%s' "$key" |
            sed -E 's/-([0-9a-f]{16,}|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z)$//')
          slot="$ref $base"
          if printf '%s\n' "$seen" | grep -qxF -- "$slot"; then
            echo "delete stale: $key on $ref (id=$id)"
            gh cache delete "$id" || echo "<warning> failed to delete cache $id"
            deleted=$((deleted + 1))
          else
            seen="${seen}${slot}"$'\n'
          fi
        done < caches.tsv

        echo "Pruned $deleted stale cache(s); kept newest per key and branch."
